name: Build APK — CleanWash Lavanderia

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do repositório
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependências npm
      - name: Instalar dependências
        run: npm ci

      # 4. Build do projeto React/Vite
      - name: Build Vite (dist/)
        run: npm run build

      # 5. Configurar Java 17 (exigido pelo Android Gradle)
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 6. Sincronizar build com projeto Android via Capacitor
      - name: Capacitor Sync Android
        run: npx cap sync android

      # 7. Dar permissão de execução ao Gradle wrapper
      - name: Permissão Gradle wrapper
        run: chmod +x android/gradlew

      # 8. Compilar APK de debug
      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # 9. Publicar o APK como artefato do workflow
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-cleanwash
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
