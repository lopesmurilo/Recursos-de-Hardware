name: Build APK — CleanWash Lavanderia

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do repositório
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configurar Java 21 (exigido pelo AGP 8.x + Gradle 8.x)
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Configurar Node.js 20
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 4. Instalar dependências npm
      - name: Instalar dependências npm
        run: npm ci

      # 5. Build do projeto React/Vite
      - name: Build Vite (dist/)
        run: npm run build

      # 6. Instalar Capacitor CLI globalmente
      - name: Instalar Capacitor CLI
        run: npm install -g @capacitor/cli@8

      # 7. Configurar Android SDK (necessário para cap sync)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 8. Aceitar licenças do Android SDK
      - name: Aceitar licenças SDK
        run: yes | sdkmanager --licenses || true

      # 9. Instalar build-tools e plataformas necessárias
      - name: Instalar Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # 10. Sincronizar build com projeto Android via Capacitor
      - name: Capacitor Sync Android
        run: npx cap sync android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # 11. Dar permissão de execução ao Gradle wrapper
      - name: Permissão Gradle wrapper
        run: chmod +x android/gradlew

      # 12. Cache do Gradle para builds mais rápidas
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 13. Compilar APK de debug
      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # 14. Verificar se APK foi gerado
      - name: Verificar APK gerado
        run: |
          ls -la android/app/build/outputs/apk/debug/ || echo "APK não encontrado!"
          find android/app/build/outputs -name "*.apk" 2>/dev/null || echo "Nenhum APK encontrado"

      # 15. Publicar o APK como artefato do workflow
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-cleanwash
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
