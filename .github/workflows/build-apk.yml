name: Build APK - CleanWash Lavanderia

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do repositorio
      - name: Checkout codigo
        uses: actions/checkout@v4

      # 2. Configurar Java 21
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Configurar Node.js 22 (exigido pelo @capacitor/cli 8.x)
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 4. Instalar dependencias npm
      - name: Instalar dependencias npm
        run: npm ci

      # 5. Build do projeto React/Vite (gera dist/)
      - name: Build Vite (dist/)
        run: npm run build

      # 6. Aceitar licencas SDK e instalar plataformas necessarias
      - name: Instalar Android SDK 36 e aceitar licencas
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      # 7. Dar permissao ao Gradle wrapper
      - name: Dar permissao ao Gradle wrapper
        run: chmod +x android/gradlew

      # 8. Configurar local.properties com ANDROID_HOME
      - name: Configurar local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # 9. Executar cap sync (cria capacitor-cordova-android-plugins e copia assets)
      - name: Capacitor Sync Android
        run: |
          echo "=== Executando npx cap sync android ==="
          npx cap sync android
          echo "=== cap sync concluido com sucesso ==="

      # 10. Verificar estrutura criada pelo cap sync
      - name: Verificar estrutura pos-sync
        run: |
          echo "=== Estrutura android/ ==="
          ls -la android/
          echo "=== Assets ==="
          ls -la android/app/src/main/assets/ 2>/dev/null || echo "assets nao encontrado"
          echo "=== capacitor-cordova-android-plugins ==="
          ls -la android/capacitor-cordova-android-plugins/ 2>/dev/null || echo "capacitor-cordova-android-plugins nao encontrado"

      # 11. Cache do Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 12. Compilar APK de debug
      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 13. Listar arquivos APK gerados
      - name: Listar APKs gerados
        run: find android/app/build/outputs/apk -name "*.apk" -ls

      # 14. Publicar o APK como artefato
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-cleanwash
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
