name: Build APK — CleanWash Lavanderia

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do repositório
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configurar Java 21 (exigido pelo AGP 8.13.0)
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Configurar Node.js 20
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 4. Instalar dependências npm
      - name: Instalar dependências npm
        run: npm ci

      # 5. Build do projeto React/Vite (gera dist/)
      - name: Build Vite (dist/)
        run: npm run build

      # 6. Dar permissão de execução ao Gradle wrapper antes de qualquer operação Android
      - name: Dar permissão ao Gradle wrapper
        run: chmod +x android/gradlew

      # 7. Configurar local.properties explicitamente com ANDROID_HOME
      - name: Configurar local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # 8. Aceitar licenças e instalar plataformas SDK necessárias
      - name: Instalar Android SDK 36 e aceitar licenças
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      # 9. Sincronizar assets e configs via Capacitor
      - name: Capacitor Sync Android
        run: npx cap sync android

      # 10. Cache do Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 11. Compilar APK de debug
      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 12. Listar arquivos APK gerados
      - name: Listar APKs gerados
        run: find android/app/build/outputs/apk -name "*.apk" -ls

      # 13. Publicar o APK como artefato
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-cleanwash
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
