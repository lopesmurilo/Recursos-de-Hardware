name: Build APK — CleanWash Lavanderia

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do repositório
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configurar Java 21 (exigido pelo AGP 8.x + Gradle 8.x)
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Configurar Node.js 20
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 4. Instalar dependências npm
      - name: Instalar dependências npm
        run: npm ci

      # 5. Build do projeto React/Vite
      - name: Build Vite (dist/)
        run: npm run build

      # 6. Copiar dist/ para assets Android (substitui cap sync)
      - name: Atualizar assets Android com build mais recente
        run: |
          rm -rf android/app/src/main/assets/public
          cp -r dist android/app/src/main/assets/public
          echo "Assets copiados com sucesso!"
          ls android/app/src/main/assets/public/

      # 7. Aceitar licenças e instalar plataforma Android 36
      - name: Instalar Android SDK 36 e aceitar licenças
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      # 8. Dar permissão de execução ao Gradle wrapper
      - name: Permissão Gradle wrapper
        run: chmod +x android/gradlew

      # 9. Cache do Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 10. Compilar APK de debug
      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 11. Verificar se APK foi gerado
      - name: Verificar APK gerado
        run: |
          find android/app/build/outputs -name "*.apk" && echo "✅ APK encontrado!" || echo "❌ APK NÃO encontrado!"

      # 12. Upload APK como artefato
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-cleanwash
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
